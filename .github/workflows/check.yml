name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: SIGNING_IDENTITY=- ./build.sh
      - name: Core and storage checks
        run: .build-mactoys/release/SelfCheck
      - name: Color picker checks
        run: bash scripts/check-color-picker.sh
      - name: Scroll reversal checks
        run: bash scripts/check-scroll-reversal.sh
      - name: Keep awake checks
        run: bash scripts/check-keep-awake.sh
      - name: Todo and Quick Panel checks
        run: bash scripts/check-todos.sh
      - name: Long-term goal checks
        run: bash scripts/check-goals.sh
      - name: Notes storage checks
        run: bash scripts/check-notes.sh
      - name: Offline Markdown editor checks
        run: bash scripts/check-notes-editor.sh
      - name: Cloud backup, restore, and GitHub API checks
        run: bash scripts/check-cloud-sync.sh
      - name: Language and translation checks
        run: bash scripts/check-localization.sh
      - name: Fresh install and bundled runtime selection
        run: bash scripts/check-release-setup.sh
      - name: Portman TCP and API checks
        working-directory: Modules/Portman
        run: PYTHONPATH=tests python3 -m unittest -v test_portman.SpecTests test_portman.LiveTests
      - name: Check GUI JavaScript
        run: |
          node --check Modules/Portman/portman/static/app.js
          node --check Modules/Portman/portman/static/i18n.js
